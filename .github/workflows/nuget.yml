name: NuGet Package

on:
  workflow_call:
    inputs:
      dotnet_version:
        required: false
        type: string
        default: "8.0.x"
      project_path:
        required: true
        type: string
      package_version:
        required: false
        type: string
        default: ""
      configuration:
        required: false
        type: string
        default: Release
      source_url:
        required: false
        type: string
        default: ""
    secrets:
      NUGET_API_KEY:
        required: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NUGET_PUBLISH_SOURCE_URL: ${{ inputs.source_url != '' && inputs.source_url || format('https://nuget.pkg.github.com/{0}/index.json', github.repository_owner) }}
      NUGET_API_KEY_VALUE: ${{ secrets.NUGET_API_KEY != '' && secrets.NUGET_API_KEY || github.token }}
      NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ github.token }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Restore dependencies
        uses: xdevhq/devops-templates/.github/actions/dotnet/restore@main
        with:
          project_path: ${{ inputs.project_path }}

      - name: Pack NuGet package
        uses: xdevhq/devops-templates/.github/actions/dotnet/pack@main
        with:
          project_path: ${{ inputs.project_path }}
          configuration: ${{ inputs.configuration }}
          version: ${{ inputs.package_version }}
          output_path: ./artifacts/nuget

      - name: Publish NuGet package
        uses: xdevhq/devops-templates/.github/actions/dotnet/push-package@main
        with:
          packages_glob: ./artifacts/nuget/*.nupkg
          source_url: ${{ env.NUGET_PUBLISH_SOURCE_URL }}
          api_key: ${{ env.NUGET_API_KEY_VALUE }}
