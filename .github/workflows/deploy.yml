name: Deploy

on:
  workflow_call:
    inputs:
      deploy_env:
        required: true
        type: string
      deploy_target:
        required: false
        type: string
        default: webapp
      image_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      container_port:
        required: false
        type: string
        default: "8080"
    secrets:
      AZURE_CREDENTIALS:
        required: true
      GHCR_USERNAME:
        required: true
      GHCR_PASSWORD:
        required: true

jobs:
  deploy:
    environment: ${{ inputs.deploy_env }}
    runs-on: ubuntu-latest
    steps:
      - name: Select environment
        run: |
          echo "Deploying target '${{ inputs.deploy_target }}' to env '${{ inputs.deploy_env }}'"

      - name: Validate deploy target
        shell: bash
        run: |
          case "${{ inputs.deploy_target }}" in
            webapp|containerapp) ;;
            *)
              echo "Unsupported deploy_target: '${{ inputs.deploy_target }}'. Use 'webapp' or 'containerapp'."
              exit 1
              ;;
          esac

      - name: Azure login
        uses: xdevhq/devops-templates/.github/actions/azure/login@main
        with:
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy container to Web App
        if: ${{ inputs.deploy_target == 'webapp' }}
        uses: xdevhq/devops-templates/.github/actions/azure/deploy-webapp@main
        with:
          azure_webapp_name: ${{ vars.AZURE_WEBAPP_NAME }}
          azure_resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
          image_name: ${{ inputs.image_name }}
          image_tag: ${{ inputs.image_tag }}
          container_port: ${{ inputs.container_port }}
          ghcr_username: ${{ secrets.GHCR_USERNAME }}
          ghcr_password: ${{ secrets.GHCR_PASSWORD }}

      - name: Deploy container to Azure Container Apps
        if: ${{ inputs.deploy_target == 'containerapp' }}
        uses: xdevhq/devops-templates/.github/actions/azure/deploy-containerapp@main
        with:
          azure_containerapp_name: ${{ vars.AZURE_CONTAINERAPP_NAME }}
          azure_resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
          image_name: ${{ inputs.image_name }}
          image_tag: ${{ inputs.image_tag }}
          container_port: ${{ inputs.container_port }}
          ghcr_username: ${{ secrets.GHCR_USERNAME }}
          ghcr_password: ${{ secrets.GHCR_PASSWORD }}
