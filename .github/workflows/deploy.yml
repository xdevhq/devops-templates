name: Deploy

on:
  workflow_call:
    inputs:
      deploy_env:
        required: true
        type: string
      image_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
    secrets:
      AZURE_CREDENTIALS:
        required: true
      GHCR_USERNAME:
        required: true
      GHCR_PASSWORD:
        required: true

jobs:
  deploy_webapp:
    environment: ${{ inputs.deploy_env }}
    runs-on: ubuntu-latest
    steps:
      - name: Select environment
        run: |
          echo "Deploying to ${{ inputs.deploy_env }}"

      - name: Azure login
        uses: alexhovy/devops-templates/.github/actions/azure/login@main
        with:
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy container to Web App
        uses: alexhovy/devops-templates/.github/actions/azure/deploy-webapp@main
        with:
          azure_webapp_name: ${{ vars.AZURE_WEBAPP_NAME }}
          azure_resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
          image_name: ${{ inputs.image_name }}
          image_tag: ${{ inputs.image_tag }}
          ghcr_username: ${{ secrets.GHCR_USERNAME }}
          ghcr_password: ${{ secrets.GHCR_PASSWORD }}
