name: Push Image

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string

jobs:
  push_image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-${{ inputs.image_name }}-${{ inputs.image_tag }}
          path: /tmp

      - name: Load image
        run: |
          podman load -i /tmp/image.tar
        shell: bash

      - name: Tag image for GHCR
        uses: alexhovy/devops-templates/.github/actions/podman/tag-image@main
        with:
          image_name: ${{ inputs.image_name }}
          image_tag: ${{ inputs.image_tag }}

      - name: Login to GHCR
        run: |
          podman login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Push image to GHCR
        uses: alexhovy/devops-templates/.github/actions/podman/push-image@main
        with:
          image_name: ${{ inputs.image_name }}
          image_tag: ${{ inputs.image_tag }}
