name: Deploy Stage

on:
  workflow_call:
    inputs:
      deploy_env:
        required: true
        type: string
      image_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string

jobs:
  deploy_webapp:
    # Job: deploy to Azure Web App
    uses: ./.github/workflows/deploy-webapp.yml
    with:
      deploy_env: ${{ inputs.deploy_env }}
      image_name: ${{ inputs.image_name }}
      image_tag: ${{ inputs.image_tag }}
