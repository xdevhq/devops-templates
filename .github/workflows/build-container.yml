name: Build Container Image

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string

jobs:
  build_container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build image with Podman
        uses: alexhovy/devops-templates/.github/actions/podman/build-image@main
        with:
          image_name: ${{ inputs.image_name }}
          image_tag: ${{ inputs.image_tag }}
          template: node

      - name: Save image as artifact
        run: |
          podman save -o /tmp/image.tar "${{ inputs.image_name }}:${{ inputs.image_tag }}"
        shell: bash

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ inputs.image_name }}-${{ inputs.image_tag }}
          path: /tmp/image.tar
