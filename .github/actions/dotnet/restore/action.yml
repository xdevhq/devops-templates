name: Dotnet Restore

inputs:
  project_path:
    required: true

runs:
  using: composite
  steps:
    - name: Restore dependencies
      shell: bash
      run: |
        set -euo pipefail

        project_path="${{ inputs.project_path }}"
        # Restore using sources configured by the consuming repository (NuGet.Config).
        dotnet restore "${project_path}"
