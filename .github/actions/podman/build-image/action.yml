name: Podman Build Image

inputs:
  image_name:
    required: true
  image_tag:
    required: true
  context:
    required: false
    default: "."
  containerfile:
    required: false
    default: "Containerfile"
  template:
    required: true
    description: "Template name under .github/containerfiles (e.g., node)"
  build_args:
    required: false
    default: ""
    description: "Additional Podman build args, e.g. --build-arg APP_PROJECT=src/App/App.csproj"

runs:
  using: composite
  steps:
    - name: Build container image
      run: |
        set -euo pipefail
        context="${{ inputs.context }}"
        containerfile="${{ inputs.containerfile }}"
        template="${{ inputs.template }}"
        build_args="${{ inputs.build_args }}"
        secret_args=()
        secret_file=""
        if [ -n "${GITHUB_PACKAGES_TOKEN:-}" ]; then
          secret_file="$(mktemp)"
          chmod 600 "${secret_file}"
          printf '%s' "${GITHUB_PACKAGES_TOKEN}" > "${secret_file}"
          trap 'rm -f "${secret_file}"' EXIT
          secret_args+=(--secret "id=github_packages_token,src=${secret_file}")
        fi

        if [ ! -f "${context}/${containerfile}" ]; then
          cp "${{ github.action_path }}/../../../containerfiles/${template}/Containerfile" "${context}/${containerfile}"
        fi
        podman build ${build_args} "${secret_args[@]}" -f "${context}/${containerfile}" -t "${{ inputs.image_name }}:${{ inputs.image_tag }}" "${context}"
      shell: bash
