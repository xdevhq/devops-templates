name: Podman Build Image

inputs:
  image_name:
    required: true
  image_tag:
    required: true
  context:
    required: false
    default: "."
  containerfile:
    required: false
    default: "Containerfile"
  template:
    required: true
    description: "Template name under .github/containerfiles (e.g., node)"
  build_args:
    required: false
    default: ""
    description: "Additional Podman build args, e.g. --build-arg APP_PROJECT=src/App/App.csproj"

runs:
  using: composite
  steps:
    - name: Build container image
      run: |
        set -euo pipefail
        context="${{ inputs.context }}"
        containerfile="${{ inputs.containerfile }}"
        template="${{ inputs.template }}"
        build_args="${{ inputs.build_args }}"
        if [ ! -f "${context}/${containerfile}" ]; then
          cp "${{ github.action_path }}/../../../containerfiles/${template}/Containerfile" "${context}/${containerfile}"
        fi
        podman build ${build_args} -f "${context}/${containerfile}" -t "${{ inputs.image_name }}:${{ inputs.image_tag }}" "${context}"
      shell: bash
