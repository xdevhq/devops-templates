name: Podman Push Image

inputs:
  image_name:
    required: true
  image_tag:
    required: true

runs:
  using: composite
  steps:
    - name: Push image to GHCR
      run: |
        podman push "ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ inputs.image_tag }}"
      shell: bash
