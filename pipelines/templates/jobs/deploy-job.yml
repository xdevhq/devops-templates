# Deploy job: environment selection + Azure deploy steps.
parameters:
  environment_name: ""
  azure_auth_command: ""
  azure_deploy_command: ""
  deploy_verify_command: ""
  image_full_name: ""
  app_name: ""
  registry_url: ""

job: deploy
steps:
  - template: ../steps/select-environment.yml
    parameters:
      environment_name: "${{ parameters.environment_name }}"

  - template: ../steps/azure-auth.yml
    parameters:
      azure_auth_command: "${{ parameters.azure_auth_command }}"

  - template: ../steps/azure-webapp-deploy.yml
    parameters:
      azure_deploy_command: "${{ parameters.azure_deploy_command }}"
      image_full_name: "${{ parameters.image_full_name }}"
      app_name: "${{ parameters.app_name }}"
      registry_url: "${{ parameters.registry_url }}"

  - template: ../steps/deploy-verify.yml
    parameters:
      deploy_verify_command: "${{ parameters.deploy_verify_command }}"
