name: Deploy Web App

on:
  workflow_call:
    inputs:
      deploy_env:
        required: true
        type: string
      image_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      azure_webapp_name:
        required: true
        type: string

jobs:
  deploy_webapp:
    runs-on: ubuntu-latest
    steps:
      - name: Select environment
        run: |
          echo "Deploying to ${{ inputs.deploy_env }}"

      - name: Azure login
        uses: ./pipelines/steps/azure/login.yml
        with:
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy container to Web App
        uses: ./pipelines/steps/azure/deploy-webapp.yml
        with:
          azure_webapp_name: ${{ inputs.azure_webapp_name }}
          image_name: ${{ inputs.image_name }}
          image_tag: ${{ inputs.image_tag }}
